name: MCTP-API CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_LOCKED: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked --dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    env:
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked --dev
      - name: Migration check
        run: uv run python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema validation
        run: uv run python manage.py spectacular --validate --file schema.yaml
      - name: Upload validated schema
        uses: actions/upload-artifact@v7
        with:
          name: openapi-schema
          path: schema.yaml
          if-no-files-found: error
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    permissions:
      contents: read
      pull-requests: write
    env:
      # 仅 CI 使用的假值，不要用于任何真实环境
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v7
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Django check
        run: uv run python manage.py check
      - name: CI script tests
        run: uv run python -m unittest discover -s scripts/tests -v
      - name: Run tests with JUnit + coverage
        run: |
          uv run coverage run --source=mctp_api manage.py test \
            --testrunner=xmlrunner.extra.djangotestrunner.XMLTestRunner \
            --verbosity=2
      - name: Generate coverage XML
        if: always() && hashFiles('.coverage') != ''
        run: uv run coverage xml -o coverage.xml
      - name: Check coverage
        if: always() && hashFiles('.coverage') != ''
        run: uv run coverage report --fail-under=85 --show-missing
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            TEST-*.xml
            coverage.xml
          if-no-files-found: ignore
          retention-days: 14
      - name: Comment CI report on PR
        id: pr_comment
        if: >-
          always() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python scripts/ci_report.py
      - name: Report PR comment failure
        if: always() && steps.pr_comment.outcome == 'failure'
        run: echo "::warning::PR CI report comment failed; see the comment step logs"

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: schema
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    env:
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      DEBUG: "False"
      ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'allow-breaking') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --locked --dev
      - name: Download validated revision schema
        uses: actions/download-artifact@v8
        with:
          name: openapi-schema
          path: revision-schema
      - name: Build base and revision schemas
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          BASE_DIR="${RUNNER_TEMP}/mctp-contract-base-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          trap 'git worktree remove --force "$BASE_DIR"' EXIT
          (
            cd "$BASE_DIR"
            uv sync --locked --dev
            uv run python manage.py spectacular --file base.yaml
          )
          cp "$BASE_DIR/base.yaml" ./base.yaml
          cp revision-schema/schema.yaml ./revision.yaml
      - name: Run oasdiff
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work \
            tufin/oasdiff@sha256:75a513546b09466bfcbb192bd1ed117e5a22945306602ba2a7bbebf2665d1076 \
            changelog base.yaml revision.yaml --format markdown > contract-changelog.md
          set +e
          docker run --rm -v "$PWD:/work" -w /work \
            tufin/oasdiff@sha256:75a513546b09466bfcbb192bd1ed117e5a22945306602ba2a7bbebf2665d1076 \
            breaking base.yaml revision.yaml --format markdown > contract-breaking.md
          status=$?
          set -e
          echo "$status" > contract-status.txt
          if [ "$status" -gt 1 ]; then
            echo "oasdiff 执行失败（exit $status）"
            exit 1
          fi
          if [ "$status" -eq 1 ] && [ "$ALLOW_BREAKING" != "true" ]; then
            echo "检测到破坏性契约变更；给 PR 加 allow-breaking 标签可放行"
            exit 1
          fi
      - name: Comment contract report on PR
        id: contract_comment
        if: >-
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run python scripts/contract_report.py
      - name: Report contract comment failure
        if: always() && steps.contract_comment.outcome == 'failure'
        run: echo "::warning::PR contract report comment failed; see the comment step logs"
      - name: Upload contract reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-reports
          path: |
            contract-*.md
            contract-status.txt
            base.yaml
            revision.yaml
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test, schema]
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'develop') ||
      github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v7
      - name: Build develop snapshot
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mctp-api:develop-${{ github.sha }}

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test, schema]
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mctp-api:production-${{ github.sha }}

  notify:
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    needs: [lint, test, schema, contract, docker, production]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Notify Jenkins
        id: notification
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || '' }}
          ACTOR: ${{ github.event.pull_request.user.login || github.actor }}
          BUILD_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          failed_jobs=""
          for pair in \
            "lint:${{ needs.lint.result }}" \
            "test:${{ needs.test.result }}" \
            "schema:${{ needs.schema.result }}" \
            "contract:${{ needs.contract.result }}" \
            "docker:${{ needs.docker.result }}" \
            "production:${{ needs.production.result }}"; do
            job="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" = "failure" ]; then
              failed_jobs="${failed_jobs}${failed_jobs:+, }${job}"
            fi
          done
          status=failure
          title="MCTP-API CI 失败"
          notification_details="失败检查: $failed_jobs"
          if [ -z "$failed_jobs" ]; then
            required_jobs="lint:${{ needs.lint.result }} test:${{ needs.test.result }} schema:${{ needs.schema.result }}"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              required_jobs="$required_jobs contract:${{ needs.contract.result }}"
              if [ "$BASE_REF" = "develop" ]; then
                required_jobs="$required_jobs docker:${{ needs.docker.result }}"
              elif [ "$BASE_REF" = "main" ]; then
                required_jobs="$required_jobs production:${{ needs.production.result }}"
              fi
            elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
              if [ "$BRANCH" = "develop" ]; then
                required_jobs="$required_jobs docker:${{ needs.docker.result }}"
              elif [ "$BRANCH" = "main" ]; then
                required_jobs="$required_jobs production:${{ needs.production.result }}"
              fi
            fi
            incomplete_jobs=""
            for pair in $required_jobs; do
              job="${pair%%:*}"
              result="${pair#*:}"
              if [ "$result" != "success" ]; then
                incomplete_jobs="${incomplete_jobs}${incomplete_jobs:+, }${job}=${result}"
              fi
            done
            if [ -n "$incomplete_jobs" ]; then
              echo "当前 CI 未全部成功（$incomplete_jobs），跳过恢复通知"
              exit 0
            fi
            previous=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f "branch=$BRANCH" -f "event=$GITHUB_EVENT_NAME" -f per_page=100 |
              jq -r --argjson current "$GITHUB_RUN_ID" \
                '[.workflow_runs[] | select(.id < $current and .status == "completed" and (.conclusion == "success" or .conclusion == "failure"))] | max_by(.id).conclusion // ""')
            if [ "$previous" = "failure" ]; then
              status=fixed
              title="MCTP-API CI 已恢复"
              notification_details="此前失败的 CI 检查已通过"
            else
              echo "仅通知失败和恢复，跳过成功"
              exit 0
            fi
          fi
          latest_run=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f "branch=$BRANCH" -f "event=$GITHUB_EVENT_NAME" -f per_page=1 \
            --jq '.workflow_runs[0].id // empty')
          if [ "$latest_run" != "$GITHUB_RUN_ID" ]; then
            echo "::notice::A newer run exists for $BRANCH; skipping stale notification"
            exit 0
          fi
          if [ -z "$JENKINS_URL" ] || [ -z "$JENKINS_USER" ] || [ -z "$JENKINS_TOKEN" ]; then
            echo "::error::Jenkins notification secrets are not configured"
            exit 1
          fi
          BASE="${JENKINS_URL%/}"
          DETAILS="${notification_details}; commit ${GITHUB_SHA:0:7}"
          curl -fsS --connect-timeout 10 --max-time 30 -u "$JENKINS_USER:$JENKINS_TOKEN" \
            -X POST "$BASE/job/MCTP-Notify/buildWithParameters" \
            --data-urlencode "REPO=MCTP-API" \
            --data-urlencode "EVENT=ci" \
            --data-urlencode "STATUS=$status" \
            --data-urlencode "TITLE=$title" \
            --data-urlencode "BRANCH=$BRANCH" \
            --data-urlencode "PR=$PR_NUMBER" \
            --data-urlencode "ACTOR=$ACTOR" \
            --data-urlencode "COMMIT=${GITHUB_SHA:0:7}" \
            --data-urlencode "URL=$BUILD_URL" \
            --data-urlencode "DETAILS=$DETAILS"

      - name: Report notification failure
        if: always() && steps.notification.outcome == 'failure'
        run: echo "::warning::Jenkins notification failed; see the notification step logs"
