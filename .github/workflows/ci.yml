name: MCTP-API CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint
    env:
      # 仅 CI 使用的假值，不要用于任何真实环境
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --dev
      - name: Django check
        run: uv run python manage.py check
      - name: Run tests
        run: uv run python manage.py test --verbosity=2

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'develop') ||
      github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      - name: Build develop snapshot
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mctp-api:develop-${{ github.sha }}

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mctp-api:production-${{ github.sha }}
