name: Auto Label PR

on:
  pull_request:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    # fork 来的 PR 没有写权限，跳过以免整条工作流变红
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Auto label by branch name
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const mapping = {
              'feat/': ['enhancement'],
              'fix/': ['bug'],
              'docs/': ['documentation'],
              'hotfix/': ['bug', 'urgent'],
              'refactor/': ['refactor'],
              'test/': ['test'],
              'chore/': ['chore'],
              'release/': ['release'],
            };
            // 本工作流管理过的标签，分支改名或换前缀时会被回收
            const managed = ['enhancement', 'bug', 'documentation', 'urgent', 'refactor', 'test', 'chore', 'release'];

            const wanted = [];
            for (const [prefix, labels] of Object.entries(mapping)) {
              if (branch.startsWith(prefix)) wanted.push(...labels);
            }

            const issue_number = context.payload.pull_request.number;
            const current = (context.payload.pull_request.labels || []).map(label => label.name);
            const stale = current.filter(name => managed.includes(name) && !wanted.includes(name));

            for (const name of stale) {
              try {
                await github.rest.issues.removeLabel({ owner: context.repo.owner, repo: context.repo.repo, issue_number, name });
              } catch (error) {
                core.warning(`移除标签 ${name} 失败：${error.message}`);
              }
            }

            if (wanted.length === 0) {
              core.info(`分支 ${branch} 没有匹配的前缀，跳过打标`);
              return;
            }

            try {
              await github.rest.issues.addLabels({ owner: context.repo.owner, repo: context.repo.repo, issue_number, labels: wanted });
            } catch (error) {
              // 标签不存在时 GitHub 返回 422，不要让整条工作流失败
              core.warning(`添加标签 ${wanted.join(', ')} 失败（标签可能尚未创建）：${error.message}`);
            }
